
name: Sparta Arena Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Oyun dosyasını bul ve bağımlılıkları kur
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $main = Get-ChildItem $env:GITHUB_WORKSPACE -Filter "main.py" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
            Select-Object -First 1

          if (!$main) {
            throw "main.py bulunamadi. GitHub deposuna main.py dosyasini yukle."
          }

          "GAME_DIR=$($main.Directory.FullName)" >> $env:GITHUB_ENV
          "GAME_MAIN=$($main.FullName)" >> $env:GITHUB_ENV

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip kurulumu basarisiz." }

          python -m pip install pygame==2.6.1 pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Gerekli kutuphaneler kurulamadi." }

          python -m py_compile "$($main.FullName)"
          if ($LASTEXITCODE -ne 0) {
            throw "main.py dosyasinda Python kod hatasi var."
          }

      - name: Windows EXE oluştur
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          Push-Location $env:GAME_DIR
          try {
            python -m PyInstaller `
              --noconfirm `
              --clean `
              --onefile `
              --windowed `
              --name SpartaArena `
              --collect-all pygame `
              --distpath "$env:GITHUB_WORKSPACE\dist" `
              "$env:GAME_MAIN"

            if ($LASTEXITCODE -ne 0) {
              throw "EXE derlemesi basarisiz oldu."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path "dist\SpartaArena.exe")) {
            throw "SpartaArena.exe olusturulamadi."
          }

      - name: EXE dosyasını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Windows
          path: |
            dist/SpartaArena.exe
          if-no-files-found: warn
          retention-days: 7
